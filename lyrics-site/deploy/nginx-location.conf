# Include inside the existing NastyEdu server block, before its catch-all proxy.
# Mount the independently released static directory; no app server is required.
location = /lyrics {
    return 301 /lyrics/$is_args$args;
}
location ^~ /lyrics/ {
    alias /srv/nasty-edu-lyrics/current/;
    index index.html;
    autoindex off;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    add_header Cache-Control "no-cache";
}
